name: Verificar frontend

'on':
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build, testes unitários e navegador
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Imagem oficial do Playwright: navegador e bibliotecas do sistema já instalados, sem apt no job.
    # A tag deve coincidir com a versão de @playwright/test fixada em frontend/package-lock.json (ver passo de guarda).
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Obter código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências fixadas
        run: npm ci
      - name: Verificar tipos
        run: npm run typecheck
      - name: Compilar
        run: npm run build
      - name: Executar testes unitários
        run: npm test
      - name: Conferir versão do Playwright e da imagem
        run: |
          versao=$(node -p "require('./node_modules/@playwright/test/package.json').version")
          echo "Playwright fixado: $versao"
          test "$versao" = "1.64.1" || { echo "Atualize a tag da imagem em .github/workflows/frontend.yml para v$versao-noble"; exit 1; }
      - name: Executar testes de navegador com servidores isolados
        run: npm run test:browser
        env:
          CI: 'true'
      - name: Publicar relatório do Playwright em caso de falha
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
          if-no-files-found: ignore

# Somente CI: servidores locais em demo e em API controlada; sem Supabase real,
# sem segredos e sem deploy.
